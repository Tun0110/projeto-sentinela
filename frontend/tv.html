<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mídia Indoor - TV</title>
<style>
* {
    box-sizing: border-box;
}

body {
    background-color: #5c4033;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    margin: 0;
}

.tv-container {
    display: flex;
    width: 95vw;
    height: 90vh;
    gap: 18px;
}

.left-panel {
    display: flex;
    flex-direction: column;
    flex: 35;
    gap: 18px;
    min-width: 0;
}

.right-panel {
    display: flex;
    flex-direction: column;
    flex: 65;
    gap: 18px;
    min-width: 0;
}

.box {
    background-color: #63d4f4;
    border: 6px solid #b39b82;
    border-radius: 15px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);

    min-width: 0;
}

.box-title {
    color: #ffffff;
    font-size: 2.2vw;
    font-weight: bold;
    text-transform: uppercase;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
    margin-bottom: 12px;
}

/* Painel esquerdo */
.local-box {
    flex: 1;
}

.local-number {
    color: #d12c2c;
    font-size: 9vw;
    font-weight: bold;
    line-height: 1;
}

.local-type {
    color: #555;
    font-size: 1.8vw;
    font-weight: bold;
    margin-top: 6px;
}

/* Histórico */
.history-box {
    flex: 1;
    justify-content: flex-start;
    align-items: flex-start;
}

.history-box .box-title {
    font-size: 1.8vw;
    align-self: center;
}

#history-list {
    list-style: none;
    width: 100%;
    color: brown;
    font-size: 1.5vw;
    font-weight: bold;
    text-align: left;
    padding: 0;
    margin: 0;
}

#history-list li {
    margin-bottom: 8px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    padding-bottom: 5px;
}

/* Painel direito */
.patient-box {
    flex: 3;
    min-width: 0;
}

.patient-name {
    color: brown;
    font-size: clamp(30px, 6vw, 80px);
    font-weight: bold;
    word-break: break-word;
    overflow-wrap: break-word;
    max-width: 100%;
}

/* Logo */
.logo-box {
    flex: 1;
    min-width: 0;
}

.logo-text {
    color: blueviolet;
    font-size: clamp(24px, 3vw, 45px);
    font-weight: bolder;
    text-transform: uppercase;
    max-width: 100%;
    overflow-wrap: break-word;
}

/* Animação */
@keyframes flash {
    0%, 100% {
        opacity: 1;
    }

    50% {
        opacity: 0.3;
    }
}

.flash {
    animation: flash 0.5s ease 3; }
    </style>  
</head>

<body>
    <!-- Estrutura da tela da TV criada para exibir 
     o local e o nome do paciente chamado -->

     <div class="tv-container">
           <img src="logo.png class="logo>
        <div class="left-panel">
            <div class="box local-box">
                <div class="box-title" id="local-tipo">GUICHÊ</div>
                <div class="local-number" id="local-numero">--</div>
            </div>

             <div class="box history-box">
               <div class="box-title">ULTIMAS CHAMADAS</div>
               <ul id="history-list"></ul>
            </div>
        </div>
     </div>    

        <div>
    <div class="right-panel">
        <div class="box pacient-box">
            <div class="box-title">PACIENTE</div>
            <div class="pacient-name" id="pacient-name">AGUARDANDO...</div>
        </div>
        <div class="box logo-box">
            <div class="logo-text">🏥 Sistema Hospitalar</div>
        </div>
    </div>
</div>
<script>
    let ultimoId = null;
    // Função criada para buscar a chamada atual e o histórico da TV em tempo real.
    function atualizar() {
        fetch("/tv/chamada")
        .then(r => r.json())
        .then(data => {
            const chamada = data.chamada;
            const histórico = data.histórico || [];

    if (chamada) {
        document.getElementById("local-tipo").innerText = chamada.localTipo || "GUICHÊ";
        document.getElementById("local-numero").innerText = chamada.localNumero || "--";
        document.getElementById("pacient-name").innerText = chamada.paciente || "AGUARDANDO...";
        // Flash visual quando há chamada nova
        if (chamada.id !== ultimoId) {
            ultimoId = chamada.id;
            const patientBox = document.querySelector(".patient-box");
            patientBox.classList.remover("flash");
            void patientBox.offseWidth; // reflow
            patientBox.classList.add("flash");
        }
    }
        // Histórico
        const list = document.getElementById("history-list");
        list.innerHTML = "";
        historico.slice(0,4).forEach(h => {
                const li = document.createElement("li");
                const tipo = h.localTipo ? h.localTipo.substring(0,4) : "GUIC";
                li.innerText = `${tipo}. ${h.localNumero} - ${h.paciente}`;
                list.appendChild(li);
            });
        })
        .catch(err => console.log("Erro ao buscar chamada:", err));
}

// Polling a cada 2 segundos
atualizar();
setInterval(atualizar, 2000);

</script>
</body>
</html>
