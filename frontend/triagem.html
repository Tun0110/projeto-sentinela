
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triagem Hospitalar</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .cabecalho {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .cabecalho h2 {
            text-align: left;
            margin: 0;
        }

        .cabecalho button {
            width: auto;
        }

        .pacientes-fila {
            background: #fff;
            color: #222;
            padding: 16px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .fila-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
        }

        .fila-item button {
            width: auto;
            margin: 0;
        }
    </style>
</head>
<body>
<main class="container">
    <div class="cabecalho">
        <h2>🏥 Triagem Hospitalar</h2>
        <button type="button" onclick="window.open('tv.html', '_blank')">
            📺 Abrir TV
        </button>
    </div>

    <section class="pacientes-fila">
        <h3 style="color:#700000">Pacientes aguardando triagem</h3>
        <div id="fila-pacientes">Carregando pacientes...</div>
        <button type="button" id="atualizarFila">🔄 Atualizar lista</button>
    </section>

    <h3>Registrar triagem</h3>
    <form id="formTriagem">
        <input id="nome" placeholder="Nome do paciente" required>

        <select id="sintoma" required>
            <option value="">Selecione o sintoma</option>
            <option value="dor_leve">Dor leve</option>
            <option value="resfriado">Resfriado</option>
            <option value="coriza">Coriza</option>
            <option value="tosse">Tosse</option>
            <option value="febre">Febre</option>
            <option value="vomito">Vômito</option>
            <option value="diarreia">Diarreia</option>
            <option value="falta_ar_moderada">Falta de ar moderada</option>
            <option value="falta_ar_grave">Falta de ar grave</option>
            <option value="infarto">Suspeita de infarto</option>
            <option value="avc">Suspeita de AVC</option>
            <option value="convulsao">Convulsão</option>
            <option value="hemorragia">Hemorragia</option>
        </select>

        <input id="temp" type="number" min="30" max="45"
               step="0.1" placeholder="Temperatura em °C" required>

        <input id="alergia" placeholder="Alergias (ou Nenhuma)">
        <textarea id="observacao" placeholder="Observações"></textarea>

        <div id="resultado"></div>
        <button type="submit">Salvar triagem</button>
    </form>

    <p id="mensagem" role="status"></p>
</main>

<script>
const filaDiv = document.getElementById("fila-pacientes");
const mensagem = document.getElementById("mensagem");

async function carregarPacientes() {
    try {
        const resposta = await fetch("/pacientes");
        if (!resposta.ok) throw new Error();

        const pacientes = await resposta.json();
        const fila = pacientes.filter(p => p.status === "triagem");

        filaDiv.replaceChildren();

        if (!fila.length) {
            filaDiv.textContent = "Nenhum paciente aguardando.";
            return;
        }

        fila.forEach(p => {
            const item = document.createElement("div");
            item.className = "fila-item";

            const info = document.createElement("div");
            const nome = document.createElement("strong");
            nome.textContent = p.nome || "Paciente";

            const detalhes = document.createElement("p");
            detalhes.textContent =
                "CPF: " + (p.cpf || "-") + " | Tipo: " + (p.tipo || "-");

            info.append(nome, detalhes);

            const botao = document.createElement("button");
            botao.type = "button";
            botao.textContent = "📺 Chamar na TV";
            botao.addEventListener("click", () => chamarNaTV(p.nome));

            item.append(info, botao);
            filaDiv.appendChild(item);
        });
    } catch {
        filaDiv.textContent = "Erro ao carregar pacientes. Verifique o servidor.";
    }
}

async function chamarNaTV(nome) {
    if (!nome) {
        alert("O paciente não possui nome cadastrado.");
        return;
    }

    try {
        const resposta = await fetch("/tv/chamar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                localTipo: "GUICHÊ",
                localNumero: "01",
                paciente: nome
            })
        });

        const dados = await resposta.json();
        if (!resposta.ok) throw new Error(dados.erro || "Falha ao chamar paciente.");

        alert(nome + " foi chamado para o Guichê 01.");
    } catch (erro) {
        alert("Não foi possível chamar na TV: " + erro.message);
    }
}

function classificarRisco(sintoma, temperatura) {
    const vermelhos = [
        "infarto", "avc", "convulsao", "hemorragia", "falta_ar_grave"
    ];
    const amarelos = [
        "febre", "vomito", "diarreia", "falta_ar_moderada"
    ];

    if (temperatura >= 39 || vermelhos.includes(sintoma)) return "vermelho";
    if (amarelos.includes(sintoma)) return "amarelo";
    return "verde";
}

document.getElementById("formTriagem").addEventListener("submit", async e => {
    e.preventDefault();

    const nome = document.getElementById("nome").value.trim();
    const sintoma = document.getElementById("sintoma").value;
    const temperatura = Number(document.getElementById("temp").value);
    const alergia = document.getElementById("alergia").value.trim() || "Nenhuma";
    const observacao = document.getElementById("observacao").value.trim();
    const risco = classificarRisco(sintoma, temperatura);

    try {
        const resposta = await fetch("/triagem", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                nome, sintoma, temperatura, alergia, observacao, risco
            })
        });

        const dados = await resposta.json();
        if (!resposta.ok) throw new Error(dados.erro || "Falha ao salvar triagem.");

        const resultado = document.getElementById("resultado");
        resultado.className = risco;
        resultado.textContent = "Classificação registrada: " + risco.toUpperCase();

        mensagem.textContent = "Triagem salva com sucesso.";
        e.target.reset();
        await carregarPacientes();
    } catch (erro) {
        mensagem.textContent = "Erro: " + erro.message;
    }
});

document.getElementById("atualizarFila")
    .addEventListener("click", carregarPacientes);

carregarPacientes();
setInterval(carregarPacientes, 10000);
</script>
</body>
</html>
